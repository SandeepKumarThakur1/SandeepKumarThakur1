<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="830" height="250" viewBox="0 0 830 250" fill="none"><style>@font-face{font-family:'Brico';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Man';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Man';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}.H{font-family:'Brico',sans-serif;font-weight:800}.M{font-family:'Man',sans-serif;font-weight:500}.MB{font-family:'Man',sans-serif;font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:6;opacity:.55}100%{r:16;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}.d6{animation-delay:.9s}
.pulse{animation:pulse 1.8s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
