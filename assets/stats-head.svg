<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="830" height="88" viewBox="0 0 830 88" fill="none"><style>@font-face{font-family:'Brico';font-weight:800;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Man';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Man';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}.H{font-family:'Brico',sans-serif;font-weight:800}.M{font-family:'Man',sans-serif;font-weight:500}.MB{font-family:'Man',sans-serif;font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{r:6;opacity:.55}100%{r:16;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.r{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}.d6{animation-delay:.9s}
.pulse{animation:pulse 1.8s ease-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
</style><rect x="1" y="1" width="828" height="86" rx="26" fill="#FFFFFF" stroke="#E1E0D9" stroke-width="1.5"/><circle cx="43" cy="44" r="15" fill="#2442FF"/><text x="43.0" y="48.5" class="MB " font-size="12" fill="#FFFFFF" text-anchor="middle">05</text><text x="70.0" y="51.5" class="H " font-size="22" fill="#111111" text-anchor="start">GitHub pulse</text><text x="794.0" y="51.0" class="MB " font-size="12" fill="#5E5D58" text-anchor="end">Live from my commits</text></svg>